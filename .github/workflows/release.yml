name: Build and release desktop
on:
  push:
    branches: [main]
    paths-ignore: ['site/**','docs/**','README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app
      - run: node scripts/prepare-native.cjs
      - run: npm test
      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/native-smoke.cjs
      - name: Native desktop smoke
        if: runner.os != 'Linux'
        run: npx electron scripts/native-smoke.cjs
      - name: Build native packages
        run: npx electron-builder --config installers/electron-builder.json --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            docs/validation/native/*
          if-no-files-found: warn
      - name: Publish tested packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          gh release view "v$version" || gh release create "v$version" --title "Media Converter $version" --notes-file docs/RELEASE.md --target "$GITHUB_SHA" --prerelease
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 | xargs -0 gh release upload "v$version" --clobber
