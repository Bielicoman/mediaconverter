<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Media Converter · roda rápida</title>
<link rel="stylesheet" href="css/wheel.css">
<style>
@font-face{font-family:Manrope;src:url(fonts/Manrope.ttf) format("truetype");font-weight:200 800}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Manrope,"Segoe UI",sans-serif;color:#e8eaee;user-select:none}
#stage{position:absolute;inset:30px;display:grid;place-items:center}
#stage svg{width:100%;height:100%}
#tip{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);max-width:420px;min-height:22px;padding:6px 12px;border-radius:10px;background:rgba(10,15,12,.92);border:1px solid rgba(255,255,255,.1);font-size:11px;line-height:1.4;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#tip.on{opacity:1}
#tip b{color:#3ee08f}
#tip.err{border-color:rgba(255,90,60,.45);color:#ffb3a3;white-space:normal}
#empty{position:absolute;inset:60px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;border-radius:50%;background:radial-gradient(circle,#101814 0%,#0a0f0c 70%);border:1px solid rgba(62,224,143,.25);box-shadow:0 0 40px rgba(62,224,143,.12);padding:40px}
#empty.on{display:flex}
#empty h2{margin:0;font-size:15px;letter-spacing:-.2px}
#empty p{margin:0;font-size:10.5px;color:#93a09a;line-height:1.6}
#empty button,.actions button{font:700 11px Manrope,sans-serif;border-radius:10px;padding:8px 13px;cursor:pointer;border:1px solid rgba(62,224,143,.35);background:linear-gradient(145deg,#66f0a8,#1fc172);color:#03200f}
#empty button.ghost,.actions button.ghost{background:rgba(255,255,255,.06);color:#d6ddd9;border-color:rgba(255,255,255,.12)}
.actions{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:none;gap:6px}
.actions.on{display:flex}
#close{position:absolute;top:34px;right:34px;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(10,15,12,.9);color:#aab3ae;cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1}
#close:hover{color:#fff;border-color:rgba(255,255,255,.3)}
</style>
<link rel="stylesheet" href="css/wheel-v2.css">
</head>
<body>
<div id="wheelModes" class="wheel-modes"><button data-mode="formats" class="active">Converter</button><button data-mode="tools">Ferramentas</button><button data-mode="actions">Ações</button></div><div id="stage"></div><img id="wheelThumb" alt="" hidden><div id="wheelPaging" class="wheel-paging"><button id="wheelPrev" aria-label="Página anterior">‹</button><span id="wheelPageLabel"></span><button id="wheelNext" aria-label="Próxima página">›</button></div>
<div id="empty"><h2>Nada selecionado</h2><p>Selecione arquivos no Explorador ou na área de trabalho e use o atalho. Arquivos copiados com Ctrl+C também valem.</p><div style="display:flex;gap:6px"><button id="pick">Escolher arquivos</button><button id="panel" class="ghost">Abrir painel</button></div></div>
<div class="actions" id="doneActions"><button id="show">Mostrar na pasta</button><button id="dismiss" class="ghost">Fechar</button></div>
<button id="close" title="Fechar (Esc)">×</button>
<div id="tip"></div>
<script src="js/wheel-svg.js"></script>
<script src="js/wheel.js"></script>
</body>
</html>
